[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "specroformer"
version = "0.1.0"
description = "SpecRoFormer: Relative Position-Aware Representation Learning for Small-Molecule MS/MS Spectra"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Guoqing Zhu" },
    { name = "Shiting Lai" },
    { name = "Xinyi Cao" },
    { name = "Keyu Hu" },
    { name = "Luojun Lin" },
    { name = "Yuanlong Yu" }
]

dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.23,<2.0",
    "scipy>=1.10",
    "pandas>=1.4",
    "scikit-learn>=1.3",
    "matchms==0.27.0",
    "rdkit==2023.9.6",
    "tqdm",
    "numba>=0.58",
    "llvmlite>=0.41",
    "optuna>=3.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1", "xlsxwriter>=3.1"]

[project.urls]
Homepage = "https://github.com/<your-username>/SpecRoFormer"
Paper = "https://doi.org/10.1021/acs.analchem.6c03195"

[tool.setuptools.packages.find]
include = ["SpecRoFormer*"]